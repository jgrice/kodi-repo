name: Update mirrored add-ons

# Daily: pull the latest POV / Magneto / Arctic Horizon 2 (and dependencies) from
# their upstream repos into docs/, so devices get updates through this repo.
on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC daily
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build.py
      - name: Commit and publish if anything changed
        run: |
          if git status --porcelain docs | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Update mirrored add-ons"
            git push
            git subtree split --prefix docs -b pages-sync
            git push -f origin pages-sync:gh-pages
          else
            echo "No upstream changes."
          fi
